version: "3.8"

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
    restart: always

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env.prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy

  redis:
    image: redis:alpine
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD?Error: REDIS_PASSWORD must be provided}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 5

  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?Error: POSTGRES_PASSWORD must be explicitly provided in the environment}
      POSTGRES_DB: market_surveillance
    volumes:
      - prod_postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  ml_engine:
    build: ./backend
    env_file:
      - .env.prod
    command: python scripts/run_engine.py
    restart: always
    depends_on:
      - redis
      - db

  crypto_worker:
    build: ./backend
    env_file:
      - .env.prod
    command: python -m scripts.market_adapters.crypto_worker
    restart: always
    depends_on:
      - redis

  sentiment_worker:
    build: ./backend
    env_file:
      - .env.prod
    command: python -m scripts.market_adapters.sentiment_worker
    restart: always
    depends_on:
      - redis

volumes:
  prod_postgres_data:
