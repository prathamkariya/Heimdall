name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: market_surveillance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
        
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest httpx pytest-asyncio ruff
        pip install -e ./backend/ml
        
    - name: Run Ruff Linter
      run: |
        cd backend
        ruff check . --ignore B008,BLE001,I001,E722,F401,F841,S113,S104,F811,T201,DTZ005,S311,E501,RUF100,DTZ003,DTZ001,S110,RUF012,PLW0602,RUF015,PLW1510,LOG015,S112,C408,RUF059,SIM102,G201,PIE810,UP035
        
    - name: Run Pytest
      env:
        DATABASE_URL: "postgresql://user:password@localhost:5432/market_surveillance_test"
        TEST_DATABASE_URL: "postgresql://user:password@localhost:5432/market_surveillance_test"
        REDIS_URL: "redis://localhost:6379/0"
        SECRET_KEY: "test_secret_key"
        GEMINI_API_KEY: "dummy_key_for_tests"
      run: |
        cd backend
        pytest tests/ ml/tests/

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: "20"
        
    - name: Install frontend dependencies
      run: |
        cd heimdall-frontend
        npm install
        
    - name: Build frontend
      run: |
        cd heimdall-frontend
        npm run build
