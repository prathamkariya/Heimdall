[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "B", "S", "BLE", "DTZ", "PLW", "LOG", "G", "UP", "RUF"]
ignore = [
    "E501", # Line too long
    "B008", # Do not perform function call in argument defaults (FastAPI uses Depends() heavily)
]

[tool.ruff.lint.per-file-ignores]
"alembic/**/*" = [
    "E402", # alembic/env.py needs to load config before importing app models
]
"tests/**/*" = [
    "S101", # asserts are the standard pytest pattern
    "S105", # false positive for token_type == "bearer" in test auth responses
    "PLW2901", # loop variables overwritten are fine in tests
    "S112", # `try`-`except`-`continue` is used for test retries
    "DTZ001", "DTZ005", "DTZ003", # Datetime timezone rules are overly strict for test data
    "F841", # Unused variables are common when unpacking test responses
    "RUF012", # Mutable class attributes in tests (e.g. pytest fixtures) are fine
    "S311", # Standard pseudo-random generators are fine for generating synthetic test data
    "BLE001", # Blind except is required to prevent one failing test setup from crashing the whole suite
]
"scripts/**/*" = [
    "S101", # verify scripts use asserts
    "S105", # dummy passwords in verify scripts
    "T201", # Scripts use print() for CLI output
    "DTZ001", "DTZ005", "DTZ003", # Scripts often generate mock time data without tzinfo
    "BLE001", # Scripts like the E2E verifier use blind excepts to report individual step failures and continue
    "E402", # Scripts inject sys.path before importing local modules
    "S311", # Pseudo-random generators are fine for synthetic data scripts
    "G004", # Logging with f-strings is acceptable in simple scripts
    "PLW0603", # Global variables are acceptable for simple script state
    "B007", # Unused loop variables are fine in scripts

]
"ml/scripts/**/*" = [
    "PLW1510", # ML scripts sometimes use subprocess without checking return code in legacy wrappers
    "DTZ005", # Mock datetime without tzinfo
    "BLE001", # Pipeline wrappers catch all exceptions to mark jobs as failed
    "E402", # Sys path manipulations before imports
    "S607", # Git executable path isn't fully qualified
    "RUF005", # Pandas array concatenation
]
"ml/src/**/*" = [
    "LOG015", # ML code uses root logger occasionally
    "S112", # `try`-`except`-`continue` in ML loops
    "BLE001", # Catch-all exceptions for loading legacy models
    "RUF002", # Ambiguous EN DASH in docstrings is acceptable
    "B905", # zip() without strict is common in legacy ML loops
]
"ml/tests/**/*" = [
    "S101", # asserts are standard in tests
    "PLW1510", # See above
    "BLE001", # See above
    "RUF043", # Regex testing often has unescaped characters
    "E402", # Tempfile/sys path manipulations before imports
    "S603", # subprocess with untrusted input is fine in tests
    "RUF005", # List concat in tests
    "B905", # zip without strict in tests
    "E712", # Equality to True is used in some test comparisons
]
"app/**/*" = [
    "S112", # `try`-`except`-`continue` used in background processors
    "DTZ003", # UTC is enforced but rule is too pedantic
    "PLW0602", # Global variables used for simple caching
    "LOG015", # Root logger usage
    "G201", # Logging exceptions
    "UP035", # Deprecated imports pending FastAPI upgrades
    "F401", # Unused imports (models) required for SQLAlchemy Base metadata registry
    "RUF100", # Unused noqa comments
    "BLE001", # Top-level routers and health checks must catch generic Exceptions to avoid crashing
    "B904", # 'raise ... from err' is good practice but not strictly required for HTTP exceptions
    "S105", # Default config values and schemas often trigger hardcoded password checks
    "G004", # Logging with f-strings is acceptable
    "PLW0603", # Global variables are used for simple module-level state like counters
    "B007", # Unused loop variables are acceptable for retries
    "RUF002", # Ambiguous unicode characters are sometimes used in schemas or docs
    "E402", # Module level import not at top of file (sometimes required to prevent circular dependencies in routers)
    "E712", # SQLAlchemy requires explicit `== True` and `== False` in filter clauses
    "B905", # zip() without strict= is acceptable in standard iterators
    "RUF005", # List concatenation with `+` is acceptable and sometimes more readable than unpacking
]
