name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: market_surveillance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip"
        cache-dependency-path: backend/requirements.txt
        
    - name: Install backend dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt
        pip install pytest httpx pytest-asyncio ruff pip-audit
        pip install -e ./backend/ml

    # FIX-14: dependency vulnerability scanning
    - name: Audit Python dependencies
      run: |
        pip-audit -r backend/requirements.txt || echo "::warning::pip-audit identified dependency advisories (e.g. unpatched python-jose upstream)"
        
    - name: Run Ruff Linter
      run: |
        cd backend
        ruff check .
        
    - name: Run Pytest
      env:
        DATABASE_URL: "postgresql://user:password@localhost:5432/market_surveillance_test"
        TEST_DATABASE_URL: "postgresql://user:password@localhost:5432/market_surveillance_test"
        REDIS_URL: "redis://localhost:6379/0"
        SECRET_KEY: "test_secret_key"
        GEMINI_API_KEY: "dummy_key_for_tests"
      run: |
        cd backend
        pytest tests/ ml/tests/

  build-frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"
        cache-dependency-path: heimdall-frontend/package-lock.json
        
    - name: Install frontend dependencies
      run: |
        cd heimdall-frontend
        npm ci || npm install

    # FIX-14: dependency vulnerability scanning — blocking at high severity
    - name: Audit npm dependencies
      run: |
        cd heimdall-frontend
        npm audit --audit-level=high

    - name: Lint frontend
      run: |
        cd heimdall-frontend
        npm run lint

    - name: Test frontend
      run: |
        cd heimdall-frontend
        npm test
        
    - name: Build frontend
      run: |
        cd heimdall-frontend
        npm run build
