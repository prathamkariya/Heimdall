events {
    worker_connections 4096;  # Up from 1024 to support 500+ concurrent SSE clients
    use epoll;                # Linux: most efficient I/O event model for many connections
}

http {
    # ── Rate limiting: REST API only (not SSE) ──────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # ── Upstream with keepalive for reuse of connections to Uvicorn ─────────
    upstream api {
        server api:8000;
        keepalive 64;  # Keep 64 idle connections alive to avoid TCP handshake overhead
    }

    server {
        listen 80;

        # ── SSE streaming endpoint ────────────────────────────────────────
        # Must NOT have rate limiting applied (SSE is one long request, not many).
        # Must have buffering disabled so events are flushed immediately.
        location ~ ^/api/v1/(alerts|market-data)/stream {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";          # Required for upstream keepalive
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Disable buffering — critical for SSE: events must reach client immediately
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;   # Allow clients to hold SSE for up to 1 hour
            proxy_send_timeout 3600s;

            # SSE content type hint
            add_header Cache-Control "no-cache";
            add_header X-Accel-Buffering "no";
        }

        # ── All other REST API endpoints ───────────────────────────────────
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }
    }
}
