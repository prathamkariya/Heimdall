worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript
                    text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting zone for REST API endpoints
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    # Upstream with keepalive pool for Uvicorn ASGI workers
    upstream heimdall_api {
        server api:8000;
        keepalive 64;
    }

    # ── HTTP Server (Port 80) — ACME challenge & HTTPS Redirect ──
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Server (Port 443) — Production TLS Gateway ─────────
    server {
        listen 443 ssl;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # TLS Certificates & Security Configuration
        ssl_certificate     /etc/letsencrypt/live/api.market-surveillance.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.market-surveillance.com/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers "EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH";
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security Headers
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── SSE streaming endpoints (alerts & market data) ──────
        location ~ ^/api/v1/(alerts|market-data)/stream {
            proxy_pass http://heimdall_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable buffering for real-time SSE streaming
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            add_header Cache-Control "no-cache";
            add_header X-Accel-Buffering "no";
        }

        # ── REST API routes ──────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://heimdall_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # ── Metrics endpoint (internal network access only) ──────
        location /metrics {
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;

            proxy_pass http://heimdall_api/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
        }

        # ── Health check (public) ────────────────────────────────
        location /health {
            proxy_pass http://heimdall_api/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # ── Static frontend assets (cached) ──────────────────────
        location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ── SPA fallback — all other routes → index.html ────────
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
